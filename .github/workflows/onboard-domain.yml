name: Onboard Domain

# Platform engineers trigger this workflow to onboard a new domain to the mesh.
# Replaces the `datameshy domain init` CLI command.
#
# End-to-end:
#   1. Write domains/{domain_name}.yaml and commit to main
#   2. Assume MeshOnboardingRole (OIDC) → provision IAM + OIDC in domain account
#   3. Instantiate DP repo from template; inject secrets
#   4. Open confirmation issue in new repo with quickstart checklist
#   Rollback: if job 2 fails → revert the domains/ commit

on:
  workflow_dispatch:
    inputs:
      domain_name:
        description: "Domain identifier (snake_case: ^[a-z][a-z0-9_]*$)"
        type: string
        required: true
      account_id:
        description: "AWS account ID for the domain (12 digits)"
        type: string
        required: true
      aws_region:
        description: "AWS region for domain infrastructure (e.g. ap-southeast-2)"
        type: string
        required: true
      owner_email:
        description: "Domain owner or on-call email address"
        type: string
        required: true
      github_repo:
        description: "Full repo slug for the domain repo (org/repo)"
        type: string
        required: true
      repo_pattern:
        description: "Glob pattern for domain product repos (e.g. JawaharRamis/mydom-*)"
        type: string
        required: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Validate inputs, write domains/{domain_name}.yaml, commit to main
  # ---------------------------------------------------------------------------
  write-registry:
    name: Write Domain Registry Entry
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      registry_commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          # Use GITHUB_TOKEN for push; the bot identity is set below
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate domain_name pattern
        run: |
          DOMAIN="${{ inputs.domain_name }}"
          if ! echo "$DOMAIN" | grep -qE '^[a-z][a-z0-9_]*$'; then
            echo "ERROR: domain_name '$DOMAIN' does not match pattern ^[a-z][a-z0-9_]*$"
            echo "domain_name must start with a lowercase letter and contain only lowercase letters, digits, and underscores."
            exit 1
          fi
          echo "domain_name validation passed: $DOMAIN"

      - name: Set up Python 3.12
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.5.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install jsonschema pyyaml

      - name: Generate domains/${{ inputs.domain_name }}.yaml
        run: |
          DOMAIN="${{ inputs.domain_name }}"
          ONBOARDED_AT=$(date -u +%Y-%m-%d)

          mkdir -p domains

          cat > "domains/${DOMAIN}.yaml" <<YAML
          # Generated by onboard-domain.yml — do not edit manually.
          # Re-trigger the workflow to update this file.
          domain_name: ${DOMAIN}
          account_id: "${{ inputs.account_id }}"
          aws_region: ${{ inputs.aws_region }}
          owner_email: ${{ inputs.owner_email }}
          github_repo: ${{ inputs.github_repo }}
          repo_pattern: ${{ inputs.repo_pattern }}
          onboarded_at: "${ONBOARDED_AT}"
          YAML

          echo "Generated domains/${DOMAIN}.yaml:"
          cat "domains/${DOMAIN}.yaml"

      - name: Validate against schemas/domain.json
        run: |
          DOMAIN="${{ inputs.domain_name }}"
          python - "domains/${DOMAIN}.yaml" "schemas/domain.json" <<'PYEOF'
          import json, sys, yaml
          from jsonschema import validate, ValidationError

          domain_path, schema_path = sys.argv[1], sys.argv[2]

          with open(schema_path) as f:
              schema = json.load(f)
          with open(domain_path) as f:
              data = yaml.safe_load(f)

          try:
              validate(instance=data, schema=schema)
              print(f"VALID: {domain_path}")
          except ValidationError as e:
              print(f"INVALID: {domain_path} — {e.message}")
              sys.exit(1)
          PYEOF

      - name: Commit and push domains/${{ inputs.domain_name }}.yaml
        id: commit
        run: |
          DOMAIN="${{ inputs.domain_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "domains/${DOMAIN}.yaml"

          if git diff --cached --quiet; then
            echo "No changes to commit — domain ${DOMAIN} already registered."
            SHA=$(git rev-parse HEAD)
          else
            git commit -m "chore: onboard domain ${DOMAIN}"
            git push origin main
            SHA=$(git rev-parse HEAD)
            echo "Committed and pushed: ${SHA}"
          fi

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: Assume MeshOnboardingRole (OIDC) and provision IAM in domain account
  # ---------------------------------------------------------------------------
  provision-iam:
    name: Provision IAM Roles in Domain Account
    runs-on: ubuntu-latest
    needs: write-registry
    permissions:
      id-token: write
      contents: read

    outputs:
      domain_role_arn: ${{ steps.create-domain-role.outputs.role_arn }}
      event_role_arn: ${{ steps.create-event-role.outputs.role_arn }}

    env:
      CENTRAL_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      DOMAIN_ACCOUNT_ID: ${{ inputs.account_id }}
      AWS_REGION: ${{ inputs.aws_region }}
      GITHUB_REPO: ${{ inputs.github_repo }}
      REPO_PATTERN: ${{ inputs.repo_pattern }}
      # GitHub OIDC thumbprint (stable — verified against GitHub's cert chain)
      GH_OIDC_THUMBPRINT: "6938fd4d98bab03faadb97b34396831e3780aea1"

    steps:
      - name: Configure AWS credentials via OIDC (MeshOnboardingRole)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/MeshOnboardingRole
          aws-region: ${{ inputs.aws_region }}
          role-session-name: MeshOnboarding-${{ inputs.domain_name }}-${{ github.run_id }}

      - name: Assume OrganizationAccountAccessRole in domain account
        id: assume-domain
        run: |
          set -euo pipefail

          CREDS=$(aws sts assume-role \
            --role-arn "arn:aws:iam::${DOMAIN_ACCOUNT_ID}:role/OrganizationAccountAccessRole" \
            --role-session-name "MeshOnboarding-${DOMAIN_ACCOUNT_ID}" \
            --output json)

          echo "::add-mask::$(echo "$CREDS" | python3 -c "import json,sys; c=json.load(sys.stdin)['Credentials']; print(c['SecretAccessKey'])")"
          echo "::add-mask::$(echo "$CREDS" | python3 -c "import json,sys; c=json.load(sys.stdin)['Credentials']; print(c['SessionToken'])")"

          AWS_ACCESS_KEY_ID=$(echo "$CREDS"     | python3 -c "import json,sys; print(json.load(sys.stdin)['Credentials']['AccessKeyId'])")
          AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | python3 -c "import json,sys; print(json.load(sys.stdin)['Credentials']['SecretAccessKey'])")
          AWS_SESSION_TOKEN=$(echo "$CREDS"     | python3 -c "import json,sys; print(json.load(sys.stdin)['Credentials']['SessionToken'])")

          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"       >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}"       >> "$GITHUB_ENV"

          echo "Assumed OrganizationAccountAccessRole in account ${DOMAIN_ACCOUNT_ID}"

      - name: Create GitHub OIDC provider in domain account
        id: create-oidc
        run: |
          set -euo pipefail

          OIDC_URL="https://token.actions.githubusercontent.com"

          # Idempotent: check if provider already exists
          EXISTING=$(aws iam list-open-id-connect-providers \
            --query "OpenIDConnectProviderList[?ends_with(Arn, '/token.actions.githubusercontent.com')].Arn" \
            --output text 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "GitHub OIDC provider already exists: ${EXISTING}"
          else
            aws iam create-open-id-connect-provider \
              --url "${OIDC_URL}" \
              --client-id-list "sts.amazonaws.com" \
              --thumbprint-list "${GH_OIDC_THUMBPRINT}"
            echo "Created GitHub OIDC provider in domain account ${DOMAIN_ACCOUNT_ID}"
          fi

          OIDC_ARN="arn:aws:iam::${DOMAIN_ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"
          echo "oidc_arn=${OIDC_ARN}" >> "$GITHUB_OUTPUT"

      - name: Create DomainGitHubActionsRole in domain account
        id: create-domain-role
        run: |
          set -euo pipefail

          DOMAIN="${{ inputs.domain_name }}"
          OIDC_ARN="arn:aws:iam::${DOMAIN_ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"
          CENTRAL_BUS_ARN="arn:aws:events:${AWS_REGION}:${CENTRAL_ACCOUNT_ID}:event-bus/mesh-central"
          ROLE_NAME="DomainGitHubActionsRole"

          TRUST_POLICY=$(python3 - <<PYEOF
          import json
          policy = {
              "Version": "2012-10-17",
              "Statement": [
                  {
                      "Effect": "Allow",
                      "Principal": {
                          "Federated": "${OIDC_ARN}"
                      },
                      "Action": "sts:AssumeRoleWithWebIdentity",
                      "Condition": {
                          "StringEquals": {
                              "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
                          },
                          "StringLike": {
                              "token.actions.githubusercontent.com:sub": [
                                  "repo:${GITHUB_REPO}:ref:refs/heads/main",
                                  "repo:${REPO_PATTERN}:ref:refs/heads/main"
                              ]
                          }
                      }
                  }
              ]
          }
          print(json.dumps(policy))
          PYEOF
          )

          # Idempotent: create role only if it does not exist
          if aws iam get-role --role-name "${ROLE_NAME}" > /dev/null 2>&1; then
            echo "Role ${ROLE_NAME} already exists — skipping create."
          else
            aws iam create-role \
              --role-name "${ROLE_NAME}" \
              --assume-role-policy-document "${TRUST_POLICY}" \
              --description "Assumed by ${GITHUB_REPO} GitHub Actions. Provisions data products in this domain account."
            echo "Created role ${ROLE_NAME}"
          fi

          INLINE_POLICY=$(python3 - <<PYEOF
          import json
          policy = {
              "Version": "2012-10-17",
              "Statement": [
                  {
                      "Sid": "S3DomainPrefixOnly",
                      "Effect": "Allow",
                      "Action": [
                          "s3:GetObject",
                          "s3:PutObject",
                          "s3:DeleteObject",
                          "s3:ListBucket"
                      ],
                      "Resource": [
                          "arn:aws:s3:::mesh-${DOMAIN}-*",
                          "arn:aws:s3:::mesh-${DOMAIN}-*/*"
                      ]
                  },
                  {
                      "Sid": "GlueDataProductOperations",
                      "Effect": "Allow",
                      "Action": [
                          "glue:CreateTable",
                          "glue:UpdateTable",
                          "glue:DeleteTable",
                          "glue:GetTable",
                          "glue:GetDatabase",
                          "glue:CreateDatabase",
                          "glue:StartJobRun",
                          "glue:GetJobRun",
                          "glue:GetJobRuns",
                          "glue:BatchStopJobRun"
                      ],
                      "Resource": "*"
                  },
                  {
                      "Sid": "StepFunctionsOperations",
                      "Effect": "Allow",
                      "Action": [
                          "states:StartExecution",
                          "states:DescribeExecution",
                          "states:StopExecution"
                      ],
                      "Resource": "*"
                  },
                  {
                      "Sid": "EventBridgePutEventsToCentralBus",
                      "Effect": "Allow",
                      "Action": ["events:PutEvents"],
                      "Resource": "${CENTRAL_BUS_ARN}"
                  },
                  {
                      "Sid": "ExplicitDenyLFPermissionManagement",
                      "Effect": "Deny",
                      "Action": [
                          "lakeformation:GrantPermissions",
                          "lakeformation:RevokePermissions",
                          "lakeformation:BatchGrantPermissions",
                          "lakeformation:BatchRevokePermissions",
                          "lakeformation:PutDataLakeSettings"
                      ],
                      "Resource": "*"
                  }
              ]
          }
          print(json.dumps(policy))
          PYEOF
          )

          aws iam put-role-policy \
            --role-name "${ROLE_NAME}" \
            --policy-name "DomainGitHubActionsPolicy" \
            --policy-document "${INLINE_POLICY}"

          ROLE_ARN="arn:aws:iam::${DOMAIN_ACCOUNT_ID}:role/${ROLE_NAME}"
          echo "role_arn=${ROLE_ARN}" >> "$GITHUB_OUTPUT"
          echo "DomainGitHubActionsRole configured: ${ROLE_ARN}"

      - name: Create MeshEventRole in domain account
        id: create-event-role
        run: |
          set -euo pipefail

          ROLE_NAME="MeshEventRole"
          CENTRAL_BUS_ARN="arn:aws:events:${AWS_REGION}:${CENTRAL_ACCOUNT_ID}:event-bus/mesh-central"

          TRUST_POLICY=$(python3 - <<PYEOF
          import json
          policy = {
              "Version": "2012-10-17",
              "Statement": [
                  {
                      "Effect": "Allow",
                      "Principal": {
                          "Service": "events.amazonaws.com"
                      },
                      "Action": "sts:AssumeRole"
                  }
              ]
          }
          print(json.dumps(policy))
          PYEOF
          )

          # Idempotent: create role only if it does not exist
          if aws iam get-role --role-name "${ROLE_NAME}" > /dev/null 2>&1; then
            echo "Role ${ROLE_NAME} already exists — skipping create."
          else
            aws iam create-role \
              --role-name "${ROLE_NAME}" \
              --assume-role-policy-document "${TRUST_POLICY}" \
              --description "EventBridge role for forwarding domain events to central mesh bus."
            echo "Created role ${ROLE_NAME}"
          fi

          INLINE_POLICY=$(python3 - <<PYEOF
          import json
          policy = {
              "Version": "2012-10-17",
              "Statement": [
                  {
                      "Sid": "PutEventsToCentralBusOnly",
                      "Effect": "Allow",
                      "Action": ["events:PutEvents"],
                      "Resource": "${CENTRAL_BUS_ARN}"
                  }
              ]
          }
          print(json.dumps(policy))
          PYEOF
          )

          aws iam put-role-policy \
            --role-name "${ROLE_NAME}" \
            --policy-name "MeshEventPolicy" \
            --policy-document "${INLINE_POLICY}"

          ROLE_ARN="arn:aws:iam::${DOMAIN_ACCOUNT_ID}:role/${ROLE_NAME}"
          echo "role_arn=${ROLE_ARN}" >> "$GITHUB_OUTPUT"
          echo "MeshEventRole configured: ${ROLE_ARN}"

      - name: Register Lake Formation S3 location (best-effort)
        continue-on-error: true
        run: |
          set -euo pipefail
          DOMAIN="${{ inputs.domain_name }}"
          aws lakeformation register-resource \
            --resource-arn "arn:aws:s3:::mesh-${DOMAIN}-gold" \
            --use-service-linked-role \
            --no-hybrid-access-enabled \
            --region "${AWS_REGION}" || true
          echo "Lake Formation location registration attempted for mesh-${DOMAIN}-gold"

      - name: Create EventBridge cross-account rule to central bus (best-effort)
        continue-on-error: true
        run: |
          set -euo pipefail
          DOMAIN="${{ inputs.domain_name }}"
          CENTRAL_BUS_ARN="arn:aws:events:${AWS_REGION}:${CENTRAL_ACCOUNT_ID}:event-bus/mesh-central"
          EVENT_ROLE_ARN="${{ steps.create-event-role.outputs.role_arn }}"

          aws events put-rule \
            --name "mesh-${DOMAIN}-to-central" \
            --event-pattern "{\"source\":[\"mesh.domain.${DOMAIN}\"]}" \
            --state ENABLED \
            --region "${AWS_REGION}"

          aws events put-targets \
            --rule "mesh-${DOMAIN}-to-central" \
            --targets "[{\"Id\":\"CentralBus\",\"Arn\":\"${CENTRAL_BUS_ARN}\",\"RoleArn\":\"${EVENT_ROLE_ARN}\"}]" \
            --region "${AWS_REGION}"

          echo "EventBridge rule mesh-${DOMAIN}-to-central created"

  # ---------------------------------------------------------------------------
  # Job 3: Rollback domains/ commit if IAM provisioning failed
  # ---------------------------------------------------------------------------
  rollback-on-failure:
    name: Rollback Registry Entry on IAM Failure
    runs-on: ubuntu-latest
    needs: [write-registry, provision-iam]
    if: failure() && needs.provision-iam.result == 'failure'
    permissions:
      contents: write

    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Revert domains/ commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          REGISTRY_SHA="${{ needs.write-registry.outputs.registry_commit_sha }}"
          CURRENT_SHA=$(git rev-parse HEAD)

          if [ "${REGISTRY_SHA}" = "${CURRENT_SHA}" ]; then
            git revert HEAD --no-edit
            git push origin main
            echo "Rolled back domains/ commit ${REGISTRY_SHA}"
          else
            echo "WARNING: HEAD has moved since registry commit. Manual rollback required."
            echo "Registry commit: ${REGISTRY_SHA}"
            echo "Current HEAD:    ${CURRENT_SHA}"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job 4: Instantiate DP repo from template and open confirmation issue
  # ---------------------------------------------------------------------------
  setup-repo:
    name: Instantiate DP Repo and Open Confirmation Issue
    runs-on: ubuntu-latest
    needs: provision-iam
    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ secrets.ORG_PAT }}
      DOMAIN: ${{ inputs.domain_name }}
      NEW_REPO: "${{ inputs.domain_name }}-products"
      DOMAIN_ROLE_ARN: ${{ needs.provision-iam.outputs.domain_role_arn }}

    steps:
      - name: Generate repo from data-meshy-product-template
        id: create-repo
        run: |
          set -euo pipefail

          echo "Creating repo JawaharRamis/${NEW_REPO} from template..."

          # Use the GitHub API to generate from template
          RESPONSE=$(gh api \
            /repos/JawaharRamis/data-meshy-product-template/generate \
            --method POST \
            -f owner=JawaharRamis \
            -f name="${NEW_REPO}" \
            -f description="Data products for the ${DOMAIN} domain" \
            -f private=false \
            --jq '.html_url' 2>&1) || {
            # 422 Unprocessable = repo already exists — treat as idempotent
            if echo "$RESPONSE" | grep -q "already exist"; then
              echo "Repo JawaharRamis/${NEW_REPO} already exists — continuing."
            else
              echo "ERROR: $RESPONSE"
              exit 1
            fi
          }

          echo "repo_url=https://github.com/JawaharRamis/${NEW_REPO}" >> "$GITHUB_OUTPUT"
          echo "Repo ready: https://github.com/JawaharRamis/${NEW_REPO}"

      - name: Set secrets on new repo
        run: |
          set -euo pipefail

          TARGET="JawaharRamis/${NEW_REPO}"
          MESH_API_ENDPOINT="${{ vars.MESH_API_ENDPOINT }}"

          echo "${DOMAIN_ROLE_ARN}" | gh secret set AWS_ROLE_ARN      --repo "${TARGET}"
          echo "${MESH_API_ENDPOINT}" | gh secret set MESH_API_ENDPOINT --repo "${TARGET}"
          echo "${DOMAIN}"           | gh secret set MESH_DOMAIN_NAME   --repo "${TARGET}"

          echo "Secrets set on ${TARGET}: AWS_ROLE_ARN, MESH_API_ENDPOINT, MESH_DOMAIN_NAME"

      - name: Open confirmation issue in new repo
        run: |
          set -euo pipefail

          TARGET="JawaharRamis/${NEW_REPO}"
          DOMAIN_ROLE_ARN="${{ needs.provision-iam.outputs.domain_role_arn }}"

          gh issue create \
            --repo "${TARGET}" \
            --title "Quickstart: complete ${DOMAIN} domain onboarding" \
            --body "$(cat <<BODY
          ## Domain onboarding checklist

          Your domain **\`${DOMAIN}\`** has been onboarded to Data Meshy. Complete the following steps to publish your first data product.

          ### AWS account (${DOMAIN_ACCOUNT_ID:-your account})

          - [ ] Verify \`DomainGitHubActionsRole\` exists: \`${DOMAIN_ROLE_ARN}\`
          - [ ] Verify S3 bucket \`mesh-${DOMAIN}-gold\` exists (create it if not — tagged \`mesh:domain=${DOMAIN}\`)
          - [ ] Verify Glue database \`${DOMAIN}_gold\` exists

          ### This repository

          - [ ] Copy \`products/example/product.yaml\` to \`products/{your-product}/product.yaml\` and fill in all fields
          - [ ] Copy \`products/example/infra.yaml\` to \`products/{your-product}/infra.yaml\` and fill in all fields
          - [ ] Push to \`main\` — the \`on-push.yml\` workflow will validate and provision your product
          - [ ] Confirm the workflow run is green in the Actions tab

          ### Domain registry

          - [ ] Your domain registry entry is at \`domains/${DOMAIN}.yaml\` in the platform repo

          ### Need help?

          Open an issue in [data-meshy](https://github.com/JawaharRamis/data-meshy) or check the [product spec reference](https://github.com/JawaharRamis/data-meshy/blob/main/docs/reference/PRODUCT-SPEC.md).

          ---
          *Generated by [onboard-domain.yml](https://github.com/JawaharRamis/data-meshy/actions/workflows/onboard-domain.yml) — run ${{ github.run_id }}*
          BODY
          )"

          echo "Confirmation issue opened in ${TARGET}"
