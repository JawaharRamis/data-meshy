name: Reusable — Product Spec Validate

on:
  workflow_call:
    inputs:
      products_dir:
        description: "Directory containing product subdirectories with product.yaml files."
        type: string
        default: "products/"

jobs:
  validate:
    name: Validate Product Specs (${{ inputs.products_dir }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.5.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install jsonschema pyyaml

      - name: Find and validate all product.yaml files
        run: |
          FAIL=0
          SPECS=$(find "${{ inputs.products_dir }}" -name "product.yaml" 2>/dev/null || true)

          if [ -z "$SPECS" ]; then
            echo "No product.yaml files found in ${{ inputs.products_dir }} — nothing to validate."
            exit 0
          fi

          SCHEMA="schemas/product_spec.json"

          for spec in $SPECS; do
            echo "Validating: $spec"
            python - "$spec" "$SCHEMA" <<'PYEOF'
          import json, sys, yaml
          from jsonschema import validate, ValidationError

          spec_path, schema_path = sys.argv[1], sys.argv[2]

          with open(schema_path) as f:
              schema = json.load(f)
          with open(spec_path) as f:
              data = yaml.safe_load(f)

          try:
              validate(instance=data, schema=schema)
              print(f"  VALID: {spec_path}")
          except ValidationError as e:
              print(f"  INVALID: {spec_path} — {e.message}")
              sys.exit(1)
          PYEOF
            if [ $? -ne 0 ]; then
              FAIL=1
            fi
          done

          exit $FAIL
